name: Android APK

on:
  push:
    branches: [main, claude/blissful-gauss-87ixb6]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest 러너에는 Android SDK가 미리 설치되어 있음 (ANDROID_HOME)
      - name: Android SDK 확인
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 패키지 설치
        run: npm install --no-audit --no-fund

      - name: 웹 파일 준비
        run: npm run build:web

      - name: 안드로이드 프로젝트 생성
        run: npx cap add android

      - name: 권한 · 세로 고정 설정
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' $M
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="portrait"#' $M
          grep -q 'permission.CAMERA' $M
          cat $M

      - name: 앱 아이콘 생성
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#111111' --iconBackgroundColorDark '#111111' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: 동기화
        run: npx cap sync android

      - name: APK 빌드
        run: |
          mkdir -p ~/.android
          cp android-config/debug.keystore ~/.android/debug.keystore
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../gudo-camera.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gudo-camera-apk
          path: gudo-camera.apk

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 구도 카메라 APK ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: gudo-camera.apk
          body: |
            휴대폰에서 아래 **gudo-camera.apk**를 눌러 내려받고 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱 설치"를 허용해야 해요.
